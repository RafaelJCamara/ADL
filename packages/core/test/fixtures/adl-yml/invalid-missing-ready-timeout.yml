version: 1
features_dir: features

commands:
  build:
    argv: [npm, ci]
    timeout: 10m
  start:
    argv: [npm, run, dev]
    timeout: 2m
    # Defect: a readiness signal with no paired timeout. SPEC-04 promises an
    # explicit signal *and* timeout — both-or-neither — so this must fail with
    # an issue naming that both are required together.
    ready:
      kind: http
      url: "http://127.0.0.1:${ADL_PORT}/health"
  test:
    argv: [npm, test]
    timeout: 15m
  teardown:
    argv: [docker, compose, down]

context:
  files: [README.md]
  max_bytes: 200000
  on_overflow: truncate

pipeline:
  - develop
  - review
  - test

limits:
  max_rounds: 6
  budget_usd: 15
  repeat_finding_threshold: 2

agents:
  developer:
    backend: claude-code
    model: default
  reviewer:
    backend: claude-code
    model: default
  tester:
    backend: claude-code
    model: default
