version: 1
features_dir: features

commands:
  build:
    argv: [npm, ci]
    timeout: 10m
  start:
    argv: [npm, run, start:tcp]
    timeout: 2m
    ready:
      kind: tcp
      port: 5432
    ready_timeout: 45s
  test:
    argv: [npm, test]
    timeout: 15m
  teardown:
    argv: [docker, compose, down]

context:
  files: [README.md]
  max_bytes: 200000
  on_overflow: truncate

pipeline:
  - develop
  - review
  - test

limits:
  max_rounds: 6
  budget_usd: 15
  repeat_finding_threshold: 2

agents:
  developer:
    backend: claude-code
    model: default
  reviewer:
    backend: claude-code
    model: default
  tester:
    backend: claude-code
    model: default
