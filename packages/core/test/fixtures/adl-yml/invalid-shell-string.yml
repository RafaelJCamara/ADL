version: 1
features_dir: features

commands:
  build:
    # Defect: argv given as a shell string instead of an argv array. No shell
    # means no quoting bugs and no injection surface from repo config — this
    # must fail with an issue path pointing at commands.build.argv.
    argv: "npm ci"
    timeout: 10m
  start:
    argv: [npm, run, dev]
    timeout: 2m
    ready:
      kind: http
      url: "http://127.0.0.1:${ADL_PORT}/health"
    ready_timeout: 30s
  test:
    argv: [npm, test]
    timeout: 15m
  teardown:
    argv: [docker, compose, down]

context:
  files: [README.md]
  max_bytes: 200000
  on_overflow: truncate

pipeline:
  - develop
  - review
  - test

limits:
  max_rounds: 6
  budget_usd: 15
  repeat_finding_threshold: 2

agents:
  developer:
    backend: claude-code
    model: default
  reviewer:
    backend: claude-code
    model: default
  tester:
    backend: claude-code
    model: default
