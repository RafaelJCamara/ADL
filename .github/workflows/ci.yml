name: CI

on:
  push:
  pull_request:

# Read-only by default. Nothing in this workflow writes to the repository, and
# a token scoped wider than the job needs is a standing invitation.
permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The existing `run:` blocks below are written in POSIX shell syntax.
    # GitHub's windows-latest images ship bash, and this default is what keeps
    # those blocks working unmodified on the new Windows leg (D-33) rather
    # than forking every step into a Windows/PowerShell variant.
    defaults:
      run:
        shell: bash

    strategy:
      # All legs always run. If only one end of the supported range or one
      # platform breaks, cancelling the others destroys exactly the evidence
      # needed to tell a Node-version problem from a platform problem from a
      # general one.
      fail-fast: false
      matrix:
        # 22 is the `engines` floor promised to adopters (>=22.12.0); 24 is the
        # dev target named in .claude/CLAUDE.md. An OSS tool whose floor is
        # never exercised is making a promise it has not checked -- and the
        # development machine runs 22.23.2, so it cannot test both ends alone.
        # 01-VALIDATION.md records this matrix as the phase's only manual-only
        # verification: a human reads the first green run.
        node-version: [22, 24]
        # windows-latest mirrors the maintainer's actual development machine
        # (Windows, Node 22.23.2 — D-33), so it is the platform local
        # iteration already runs against. ubuntu-latest remains the deployment
        # target's proxy (Phase 2 D-05 names Linux as the deployment target).
        os: [ubuntu-latest, windows-latest]
        exclude:
          # Node 24 on Windows is a stated, accepted gap (D-33) -- it costs
          # one matrix line to close later, not a blocker now. This leaves
          # three legs: ubuntu/22, ubuntu/24, windows/22.
          - os: windows-latest
            node-version: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Activate pnpm via corepack
        # corepack honours the `packageManager` field, so this resolves the
        # same pnpm a contributor gets. Activated AFTER setup-node so the shims
        # land in the Node installation the rest of the job actually uses.
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ matrix.node-version }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-pnpm-

      - name: Install
        # --frozen-lockfile is half of the version-drift mitigation (T-1-14);
        # test/toolchain.test.ts is the other half. This one refuses to resolve
        # anything new; that one asserts what was resolved is still compatible.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Provision the unprivileged worker user
        # Two of Phase 2's acceptance criteria -- WORK-05's privilege drop, and
        # the OS-user half of success criterion 4 -- have no subject without a
        # second OS identity on the machine. The development machine is Windows,
        # where they skip with a stated reason (D-05, D-21), so this job is the
        # only place they can actually execute. Without this step they would
        # skip here too, and the phase would be signed off on evidence that was
        # never produced (T-2-33).
        #
        # Linux-only (D-33, Phase 2 D-05): the privilege drop has no Windows
        # subject, and every command below is a Linux/`sudo`/`getent` primitive
        # that would simply fail on the Windows runner rather than degrade
        # gracefully. Gated here rather than made cross-platform.
        if: runner.os == 'Linux'
        #
        # Every command is idempotent: a re-run on a warm runner must not fail
        # on "group already exists".
        run: |
          set -euo pipefail
          me=$(id -un)

          # D-06: the worker is PRE-PROVISIONED, never created by the daemon at
          # runtime -- which is what keeps the long-running manager from ever
          # needing root-capable permissions. This step is the install script an
          # adopting team runs once; packages/workspace/README.md is the same
          # thing written for a human.
          getent group adl-worker >/dev/null || sudo groupadd --system adl-worker
          id -u adl-worker >/dev/null 2>&1 || sudo useradd \
            --system --gid adl-worker \
            --no-create-home --shell /usr/sbin/nologin \
            adl-worker

          # The daemon user joins the shared group. Setting a directory's group
          # requires membership of it, so without this applyWorkerAccess
          # degrades with EPERM and the worker cannot write its own scratch HOME.
          sudo usermod --append --groups adl-worker "$me"

          # adl-worker joins the runner's OWN group so it can traverse
          # $GITHUB_WORKSPACE. This exists only because CI's fake `claude`
          # binaries are test fixtures checked out under $HOME (mode 0750,
          # readable only by "$me" and its group) -- a shape that does not
          # occur in a real deployment, where the pinned agent CLI lives at a
          # world-readable system path (e.g. /usr/local/bin), never behind a
          # user's restricted home directory. Without this, EVERY dropped-
          # privilege exec of a test fixture fails with a permission-denied
          # module-resolution error misclassified as a generic provider_error
          # (reproduced on ubuntu-latest: `namei -om` on a fixture path shows
          # `/home/runner` as `drwxr-x--- runner runner`, and adl-worker is a
          # member of no group but its own). Grants read/traverse only --
          # adl-worker was never given write access to "$me"'s files and this
          # does not change that.
          sudo usermod --append --groups "$me" adl-worker

          # SETENV, not a bare NOPASSWD. `sudo` resets the environment by
          # default, and the environment it would reset is the zero-inherit one
          # buildChildEnv constructs from nothing -- the scratch HOME and every
          # git and npm neutraliser inside it. The launcher passes
          # --preserve-env; SETENV is what permits that.
          #
          # !secure_path is the same class of reason: sudo would otherwise
          # replace the child's PATH with its own, silently overriding
          # ExecSpec.path and reintroducing Pitfall 7 in a form that appears
          # only under the drop.
          #
          # The grant is to run commands as ONE specific unprivileged user
          # (T-2-34) -- not `(ALL)`, which is a different and much larger thing.
          sudoers=$(mktemp)
          {
            echo "$me ALL=(adl-worker) NOPASSWD:SETENV: ALL"
            echo "Defaults>adl-worker !secure_path"
          } > "$sudoers"
          # Validated BEFORE installation. A syntax error in a file under
          # /etc/sudoers.d breaks sudo for the remainder of the job, and the
          # failure would look nothing like its cause.
          sudo visudo --check --quiet --file="$sudoers"
          sudo install -m 0440 -o root -g root "$sudoers" /etc/sudoers.d/adl-worker

          # Printed so the human reading this run at the 02-07 checkpoint can
          # see the identity exists rather than infer it from a green tick.
          getent passwd adl-worker
          getent group adl-worker
          sudo --non-interactive --user adl-worker -- id

          # What turns the skip into an execution. test/helpers/platform.ts
          # reads these two, and on Linux with them unset the privilege cases
          # FAIL rather than skip -- that asymmetry is the whole point of D-21.
          echo "ADL_WORKER_USER=adl-worker" >> "$GITHUB_ENV"
          echo "ADL_WORKER_GROUP=adl-worker" >> "$GITHUB_ENV"

      - name: DIAGNOSTIC - worker traversal probe
        if: runner.os == 'Linux'
        run: |
          set -x
          echo "--- id as caller ---"
          id
          echo "--- id as adl-worker ---"
          sudo --non-interactive --user adl-worker -- id || true
          echo "--- namei on the fixture path ---"
          namei -om "$GITHUB_WORKSPACE/packages/manager/test/helpers/fake-claude-success.mjs" || true
          echo "--- can adl-worker read the fixture? ---"
          sudo --non-interactive --user adl-worker -- cat "$GITHUB_WORKSPACE/packages/manager/test/helpers/fake-claude-success.mjs" > /dev/null && echo OK || echo FAIL
          echo "--- can adl-worker list HOME dir ---"
          sudo --non-interactive --user adl-worker -- ls -la /home/runner 2>&1 || echo FAIL
          echo "--- can adl-worker list workspace root ---"
          sudo --non-interactive --user adl-worker -- ls -la "$GITHUB_WORKSPACE" 2>&1 || echo FAIL
          echo "--- stat chain ---"
          stat -c '%A %U %G %n' /home /home/runner /home/runner/work /home/runner/work/ADL /home/runner/work/ADL/ADL || true

      - name: Test
        # The command is unchanged; only the credentials it runs under are.
        # `usermod` above added this user to the adl-worker group, but
        # supplementary group membership is established when credentials are
        # created -- the already-running runner process does not pick it up, and
        # chown(2) refuses a group the caller is not in. `sg` re-establishes the
        # group list for this one command, which is what lets applyWorkerAccess
        # give the worker its scratch HOME instead of degrading with EPERM.
        #
        # Linux-only: `sg` and the `adl-worker` identity only exist on the leg
        # that ran the provisioning step above.
        if: runner.os == 'Linux'
        run: sg adl-worker -c "pnpm -r test"

      - name: Test (non-Linux)
        # `sg` does not exist on Windows, and the privilege-drop provisioning
        # it re-establishes group membership for has no Windows subject
        # (Phase 2 D-05) -- so this leg runs the same suite directly under the
        # runner's own credentials. The privilege-drop assertions skip loudly
        # here via packages/manager/test/helpers/platform.ts's `windowsOnly`
        # (and packages/workspace's existing `linuxOnly`/`posixOnly`) rather
        # than passing vacuously.
        if: runner.os != 'Linux'
        run: pnpm -r test

      - name: Test (workspace root suite)
        # `pnpm -r` iterates the workspace PACKAGES and deliberately excludes
        # the root, so the step above reports "3 of 4 projects" and never runs
        # test/. Without this step the architecture-rule fixtures and the
        # toolchain pin would sit in the repository unexecuted -- Pitfall 8
        # arriving through a side door, with the rules once again unproven in
        # the only place it matters.
        run: pnpm vitest run --project root
